<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cầu nguyện mỗi ngày</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Giao diện theo app mẫu "Làm chủ sự học": nền xanh tím than, nút vàng, điểm nhấn xanh ngọc */
:root{
  --navy1:#1C1A4A; --navy2:#2B296D; --navy3:#131230; --sheet:#1a1850;
  --ink:#EDEFFB; --ink-dim:rgba(237,239,251,.66); --ink-faint:rgba(237,239,251,.42);
  --panel:rgba(255,255,255,.045); --panel-hover:rgba(255,255,255,.075);
  --border:rgba(255,255,255,.12); --border-soft:rgba(255,255,255,.06);
  --teal:#00A79D; --teal-bg:rgba(0,167,157,.16);
  --gold:#FFD400; --gold-ink:#241D00;
  --amber:#FDB913; --amber-bg:rgba(253,185,19,.16);
  --red:#f85149; --red-bg:rgba(248,81,73,.16);
  --serif:'Crimson Text',Georgia,'Times New Roman',serif;
  --mono:'Space Mono',ui-monospace,Menlo,Consolas,monospace;
  --radius:16px; --radius-sm:10px; --sib:env(safe-area-inset-bottom,0px); --sit:env(safe-area-inset-top,0px);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{-webkit-tap-highlight-color:transparent;}
body{min-height:100vh;background:var(--navy3);
  background-image:radial-gradient(circle at 10% 8%,rgba(0,167,157,.10),transparent 30%),radial-gradient(circle at 92% 88%,rgba(255,212,0,.07),transparent 32%),linear-gradient(135deg,var(--navy1) 0%,var(--navy2) 55%,var(--navy3) 100%);
  background-attachment:fixed;color:var(--ink);font-family:var(--serif);font-size:17px;line-height:1.55;}
button{cursor:pointer;font-family:var(--mono);border:none;background:none;color:inherit;font-size:13px;}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--teal);outline-offset:2px;}
input{font-family:var(--serif);background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;color:var(--ink);font-size:17px;width:100%;outline:none;}
input:focus{border-color:var(--teal);}
a{color:var(--teal);}
.hidden{display:none !important;}
.shell{max-width:760px;margin:0 auto;padding:calc(18px + var(--sit)) max(16px,env(safe-area-inset-right,0px)) calc(40px + var(--sib)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 18px;border-radius:var(--radius-sm);font-size:13px;font-weight:700;letter-spacing:.02em;}
.btn:active{transform:scale(.97);}
.btn-gold{background:var(--gold);color:var(--gold-ink);}
.btn-ghost{background:var(--panel);border:1px solid var(--border);color:var(--ink);}
.btn-teal{background:var(--teal-bg);color:var(--teal);border:1px solid rgba(0,167,157,.4);}
.btn-red{background:var(--red-bg);color:var(--red);border:1px solid rgba(248,81,73,.4);}
.btn-block{width:100%;}
.btn[disabled]{opacity:.4;cursor:not-allowed;}
/* màn mở khóa */
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.gate-box{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:32px 24px;text-align:center;display:flex;flex-direction:column;gap:12px;}
.gate-emoji{font-size:38px;}
.gate-title{font-size:24px;font-weight:600;}
.gate-sub{font-size:15px;color:var(--ink-dim);font-style:italic;}
.gate-box input{text-align:center;}
.gate-error{color:var(--red);font-size:14px;min-height:18px;}
.names{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
.name-chip{padding:12px 22px;border-radius:999px;background:var(--panel);border:1px solid var(--border);font-size:15px;}
/* đầu trang */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;font-family:var(--mono);font-size:12px;color:var(--ink-dim);}
.sync{font-size:11px;}
.sync.ok{color:var(--teal);} .sync.busy{color:var(--gold);} .sync.off{color:var(--amber);}
.icon-btn{width:42px;height:42px;border-radius:var(--radius-sm);background:var(--panel);border:1px solid var(--border);display:inline-flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.date-row{display:flex;align-items:center;gap:8px;}
.date-main{flex:1;text-align:center;min-width:0;}
.date-main .d{font-size:22px;font-weight:600;line-height:1.25;}
.date-main .l{font-family:var(--mono);font-size:11.5px;color:var(--ink-dim);letter-spacing:.02em;}
.date-main .le{font-size:15.5px;font-style:italic;color:var(--gold);line-height:1.35;margin-top:3px;text-wrap:balance;}
.verse .vhs{display:flex;flex-direction:column;gap:4px;border-top:1px solid rgba(255,212,0,.22);padding-top:10px;margin-top:2px;}
.verse .vhs b{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:var(--teal);font-weight:700;}
.verse .vhs span{font-size:16.5px;line-height:1.5;color:var(--ink);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;}
.tag-mua{font-family:var(--mono);font-size:10.5px;color:#C9A7FF;border:1px solid rgba(201,167,255,.5);border-radius:99px;padding:2px 9px;letter-spacing:.06em;}
.phu li{background:var(--panel);border-left-color:var(--border);}
.fam{display:grid;grid-template-columns:1fr 1fr;gap:10px;} .fam .full{grid-column:1/-1;}
.fam label{display:flex;flex-direction:column;gap:4px;font-family:var(--mono);font-size:11px;color:var(--ink-dim);}
.notice{border-radius:var(--radius-sm);padding:10px 13px;font-size:14.5px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
.notice.amber{background:var(--amber-bg);border:1px solid rgba(253,185,19,.4);}
.notice.red{background:var(--red-bg);border:1px solid rgba(248,81,73,.4);}
.card{background:var(--panel);border:1px solid var(--border);border-left:3px solid var(--border);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:10px;}
.card.ok{border-left-color:var(--teal);} .card.wa{border-left-color:var(--amber);}
.card-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;}
.card-title{font-family:var(--mono);font-size:12.5px;font-weight:700;letter-spacing:.05em;}
.card-meta{font-family:var(--mono);font-size:11.5px;color:var(--ink-dim);white-space:nowrap;}
.card-desc{font-size:15.5px;color:var(--ink-dim);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.card-warn{font-family:var(--mono);font-size:12px;color:var(--amber);}
.card .btn{align-self:flex-start;}
/* màn đọc */
.reader-top{position:sticky;top:0;z-index:5;background:linear-gradient(var(--navy1),rgba(28,26,74,.94));padding:calc(10px + var(--sit)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--border-soft);}
.reader-bar{display:flex;align-items:center;gap:10px;max-width:760px;margin:0 auto;width:100%;}
.reader-bar .t{flex:1;font-family:var(--mono);font-size:12.5px;color:var(--ink-dim);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.reader-bar .n{font-family:var(--mono);font-size:12px;color:var(--ink-dim);font-variant-numeric:tabular-nums;}
.prog{height:4px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;max-width:760px;margin:0 auto;width:100%;}
.prog>i{display:block;height:100%;background:var(--teal);width:0;transition:width .2s;}
.reader{max-width:760px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(110px + var(--sib)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px;}
.part-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;}
.part-title{font-family:var(--mono);font-size:13px;font-weight:700;letter-spacing:.06em;}
.pose{font-family:var(--mono);font-size:11px;color:var(--teal);border:1px solid rgba(0,167,157,.5);border-radius:99px;padding:2px 10px;letter-spacing:.06em;}
.ln{display:flex;flex-direction:column;gap:4px;}
.ln .who{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.08em;}
.ln .tx{font-size:21px;line-height:1.7;overflow-wrap:anywhere;}
/* Mỗi người một màu: chồng xanh ngọc, vợ vàng, cả hai trắng đậm; hướng dẫn chữ nghiêng mờ, không khung */
.ln.vA,.ln.vB,.ln.vC{padding:10px 14px 12px;border-radius:12px;border-left:5px solid;}
.ln.vA{border-color:var(--teal);background:rgba(0,167,157,.10);} .ln.vA .who{color:var(--teal);}
.ln.vB{border-color:var(--gold);background:rgba(255,212,0,.08);} .ln.vB .who{color:var(--gold);}
.ln.vC{border-color:var(--ink);background:rgba(255,255,255,.09);} .ln.vC .who{color:var(--ink);} .ln.vC .tx{font-weight:600;}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex-shrink:0;}
.dot.A{background:var(--teal);} .dot.B{background:var(--gold);}
.ln.guide .tx{font-size:16px;font-style:italic;color:var(--ink-dim);line-height:1.55;}
.legend{display:flex;gap:14px;flex-wrap:wrap;max-width:760px;margin:0 auto;width:100%;font-family:var(--mono);font-size:11.5px;color:var(--ink-dim);}
.legend span{display:inline-flex;align-items:center;gap:5px;}
.missing{font-family:var(--mono);font-size:12.5px;color:var(--amber);background:var(--amber-bg);border-radius:var(--radius-sm);padding:12px;line-height:1.6;}
.inha-sec{display:flex;flex-direction:column;gap:6px;}
.inha-h{font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--teal);}
.inha-t{font-size:21px;line-height:1.7;white-space:pre-line;}
.inha-ref{font-family:var(--mono);font-size:12px;color:var(--ink-dim);}
.hon-song{border:1px solid rgba(255,212,0,.45);background:rgba(255,212,0,.06);border-radius:var(--radius);padding:14px;}
.hon-song .inha-h{color:var(--gold);}
.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:linear-gradient(rgba(19,18,48,0),var(--navy3) 35%);padding:22px max(16px,env(safe-area-inset-right,0px)) calc(14px + var(--sib)) max(16px,env(safe-area-inset-left,0px));}
.bottom-nav .in{max-width:760px;margin:0 auto;display:flex;gap:10px;}
.bottom-nav .btn{flex:1;}
/* hồi tâm */
.step-title{font-size:27px;font-weight:600;text-align:center;text-wrap:balance;}
.step-prayer{font-size:21px;line-height:1.7;font-style:italic;text-align:center;}
.step-hint{font-size:18px;line-height:1.65;color:var(--ink-dim);text-align:center;}
.timer{align-self:center;width:150px;height:150px;border-radius:50%;border:2px solid rgba(0,167,157,.5);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;}
.timer .v{font-family:var(--mono);font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;}
.timer .k{font-family:var(--mono);font-size:11px;color:var(--ink-dim);}
.timer.done{border-color:var(--gold);} .timer.done .v{color:var(--gold);}
/* khung trượt từ dưới lên */
.overlay{position:fixed;inset:0;background:rgba(10,9,30,.72);z-index:20;display:flex;align-items:flex-end;justify-content:center;}
@media(min-width:640px){.overlay{align-items:center;}}
.sheet{background:var(--sheet);border:1px solid var(--border);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:22px 20px calc(20px + var(--sib));display:flex;flex-direction:column;gap:12px;max-height:90vh;overflow:auto;}
@media(min-width:640px){.sheet{border-radius:20px;}}
.sheet-title{font-size:20px;font-weight:600;}
.sheet-sub{font-size:14.5px;color:var(--ink-dim);font-style:italic;}
.menu-list{display:flex;flex-direction:column;gap:8px;}
.menu-list .btn{justify-content:flex-start;}
/* quản trị */
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--border-soft);font-size:16px;}
.kv b{font-family:var(--mono);font-size:13px;}
.ok-t{color:var(--teal);} .wa-t{color:var(--amber);}
.grid-wrap{overflow-x:auto;}
table.grid{border-collapse:separate;border-spacing:4px;min-width:480px;width:100%;}
.grid th{font-family:var(--mono);font-size:11px;color:var(--ink-dim);font-weight:700;}
.grid th[scope=row]{text-align:left;white-space:nowrap;}
.cell{width:100%;min-height:46px;border-radius:8px;border:1px solid var(--border);background:var(--panel);font-family:var(--mono);font-size:14px;}
.cell.ok{border-color:rgba(0,167,157,.5);background:var(--teal-bg);color:var(--teal);}
.cell.wa{border-color:rgba(253,185,19,.5);background:var(--amber-bg);color:var(--amber);}
.errs{list-style:none;display:flex;flex-direction:column;gap:6px;}
.errs li{font-size:14.5px;padding:8px 11px;border-radius:8px;background:var(--amber-bg);border-left:3px solid var(--amber);}
.errs li a{font-family:var(--mono);font-size:12px;}
.hint{font-size:14px;color:var(--ink-faint);font-style:italic;}
/* câu Lời Chúa của ngày, đầu trang */
.verse{display:flex;flex-direction:column;gap:8px;width:100%;text-align:left;padding:18px 18px 16px;border-radius:var(--radius);
  background:linear-gradient(135deg,rgba(255,212,0,.11),rgba(0,167,157,.08));border:1px solid rgba(255,212,0,.30);font-family:var(--serif);color:var(--ink);}
.verse .vk{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--gold);}
.verse .vq{font-size:22px;line-height:1.5;font-style:italic;text-wrap:pretty;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;}
.verse .vr{font-family:var(--mono);font-size:12px;color:var(--ink-dim);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;}
@media(max-width:480px){.verse .vq{font-size:20px;}}
/* chuỗi ngày giữ chung cả nhà */
.streak{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border-radius:var(--radius);background:var(--panel);border:1px solid var(--border);color:var(--ink);text-align:left;}
.streak .sk-n{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.streak .sk-n b{font-family:var(--serif);font-size:30px;font-weight:600;color:var(--gold);line-height:1;font-variant-numeric:tabular-nums;}
.streak .sk-n span{font-family:var(--mono);font-size:11px;line-height:1.3;color:var(--ink-dim);}
.sk-dots{display:flex;gap:4px;flex:1;justify-content:center;min-width:0;}
.sk-dot{width:26px;display:flex;flex-direction:column;align-items:center;gap:3px;font-family:var(--mono);font-size:9.5px;color:var(--ink-faint);}
.sk-dot i{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--border);display:block;}
.sk-dot.giu i{background:var(--teal);border-color:var(--teal);}
.sk-dot.hn{color:var(--gold);} .sk-dot.hn i{border-color:var(--gold);} .sk-dot.hn.giu i{background:var(--gold);}
.sk-go{font-family:var(--mono);font-size:11.5px;color:var(--ink-dim);flex-shrink:0;}
@media(max-width:400px){.sk-dot{width:20px;}.sk-go{display:none;}}
.cal-head{display:flex;justify-content:space-between;align-items:center;gap:8px;}
.cal-head .t{font-size:19px;font-weight:600;}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;}
.cal .dw{font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);text-align:center;padding:4px 0;}
.cal button{aspect-ratio:1;border-radius:8px;font-size:13px;border:1px solid transparent;color:var(--ink-dim);background:var(--panel);}
.cal button.giu{background:var(--teal-bg);border-color:rgba(0,167,157,.55);color:var(--teal);font-weight:700;}
.cal button.hn{border-color:var(--gold);color:var(--gold);}
.cal button.hn.giu{background:rgba(255,212,0,.18);font-weight:700;}
.cal button:disabled{opacity:.25;cursor:default;}
.cal-sum{font-size:15.5px;color:var(--ink-dim);}
/* kết nối máy chủ, cài đặt lần đầu, nạp nội dung */
.gate-box .f{display:flex;flex-direction:column;gap:5px;text-align:left;font-family:var(--mono);font-size:11.5px;color:var(--ink-dim);letter-spacing:.02em;}
.gate-box .f input{text-align:left;}
.gate-steps{display:flex;flex-direction:column;gap:12px;}
.linkbtn{font-family:var(--mono);font-size:12px;color:var(--ink-faint);text-decoration:underline;align-self:center;padding:6px;}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;}
.nap{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-top:1px solid var(--border-soft);}
.nap-t{font-family:var(--mono);font-size:12.5px;font-weight:700;letter-spacing:.03em;}
.nap .btn{align-self:flex-start;}
.nap-st{font-size:15.5px;}
.nap-st.ok{color:var(--teal);} .nap-st.err{color:var(--red);} .nap-st.busy{color:var(--gold);}
.nap details{font-family:var(--mono);font-size:12px;color:var(--ink-dim);}
.nap details summary{cursor:pointer;padding:4px 0;}
.nap .range{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px;}
.nap .range input{width:110px;font-family:var(--mono);font-size:14px;padding:8px;}
.bar{height:6px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;}
.bar>i{display:block;height:100%;width:0;background:var(--gold);transition:width .2s;}
.share{font-family:var(--mono);font-size:12.5px;word-break:break-all;background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;user-select:all;-webkit-user-select:all;}
.toast{position:fixed;left:50%;bottom:calc(90px + var(--sib));transform:translateX(-50%) translateY(10px);background:var(--sheet);border:1px solid var(--border);padding:10px 16px;border-radius:14px;font-family:var(--mono);font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:30;max-width:90vw;text-align:center;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
@media(prefers-reduced-motion:reduce){.prog>i,.toast{transition:none;}}
@media(max-width:480px){.ln .tx,.inha-t,.step-prayer{font-size:19.5px;}.date-main .d{font-size:19px;}}
</style>
</head>
<body>

<div id="vBoot" class="gate"><div class="gate-box"><div class="gate-emoji">🕯️</div><div class="gate-title">Cầu nguyện mỗi ngày</div><div class="gate-sub">Đang mở…</div></div></div>

<div id="vLock" class="gate hidden">
  <div class="gate-box">
    <div class="gate-emoji">🕯️</div>
    <div class="gate-title">Cầu nguyện mỗi ngày</div>
    <div class="gate-sub">App riêng của gia đình</div>
    <div id="lockBusy" class="gate-sub hidden">Đang kết nối… (lần đầu mất 10–30 giây)</div>
    <div id="lockStep0" class="gate-steps hidden">
      <div class="gate-sub" style="font-style:normal;color:var(--ink)">Kết nối máy chủ — chỉ làm một lần</div>
      <label class="f" for="srv">Đường dẫn Ứng dụng web (kết thúc bằng /exec)
        <input id="srv" type="url" inputmode="url" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
      <div class="gate-error" id="srvErr"></div>
      <button class="btn btn-gold btn-block" id="btnSrv">Kết nối</button>
    </div>
    <div id="lockSetup" class="gate-steps hidden">
      <div class="gate-sub" style="font-style:normal;color:var(--ink)">Cài đặt lần đầu — tên gọi hai vợ chồng</div>
      <label class="f" for="suA">Tên gọi người chồng
        <input id="suA" type="text" value="Anh" autocomplete="off"></label>
      <label class="f" for="suB">Tên gọi người vợ
        <input id="suB" type="text" value="Em" autocomplete="off"></label>

<script>
/* Đường dẫn máy chủ (Ứng dụng web /exec) của gia đình. Để trống thì lần đầu mở app sẽ hỏi. App không dùng mật khẩu. */
const API_URL = "https://script.google.com/macros/s/AKfycby69IHKVcihYgHTBcUZYpTBXWgrCgbGanpUJpyJpi4wacZtI-nJgb56r4CkzG-SuJVCyw/exec";

/* ===================== Trạng thái & bộ nhớ trên máy ===================== */
var S = { url:'', member:null, members:[], admin:null, ngay:null, homNay:null, data:null, ks:{i:0,flat:[]}, ht:{i:0,timer:null,left:0}, wake:null };
function ls(k,v){ try{ if(v===undefined) return localStorage.getItem(k); if(v===null) localStorage.removeItem(k); else localStorage.setItem(k,v); }catch(e){ return null; } }
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function show(id){ ['vBoot','vLock','vHome','vKS','vIN','vHT','vAD'].forEach(function(v){ $(v).classList.toggle('hidden',v!==id); }); window.scrollTo(0,0); }
function toast(m){ var t=$('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(function(){t.classList.remove('show');},2400); }
function sync(s){ var e=$('sync'); e.className='sync '+(s==='ok'?'ok':s==='busy'?'busy':'off'); e.textContent= s==='ok'?'✓ Đã đồng bộ': s==='busy'?'Đang đồng bộ…':'Đang dùng bản lưu'; }

/* ===================== Ngày theo giờ Việt Nam ===================== */
function homNayVN(){ var d=new Date(Date.now()+7*3600000); return d.getUTCFullYear()+'-'+p2(d.getUTCMonth()+1)+'-'+p2(d.getUTCDate()); }
function gioVN(){ return new Date(Date.now()+7*3600000).getUTCHours(); }
function p2(n){ return (n<10?'0':'')+n; }
function congNgay(s,n){ var p=s.split('-'); var d=new Date(Date.UTC(+p[0],p[1]-1,+p[2])+n*86400000); return d.getUTCFullYear()+'-'+p2(d.getUTCMonth()+1)+'-'+p2(d.getUTCDate()); }
var THU_DAY=['Chúa Nhật','Thứ Hai','Thứ Ba','Thứ Tư','Thứ Năm','Thứ Sáu','Thứ Bảy'];
function tenNgay(s){ var p=s.split('-'); var d=new Date(Date.UTC(+p[0],p[1]-1,+p[2])); return THU_DAY[d.getUTCDay()]+' '+p[2]+'/'+p[1]+'/'+p[0]; }
function ngayNgan(s){ var p=s.split('-'); return p[2]+'/'+p[1]; }

/* ===================== Gọi máy chủ: thử lại 3 lần ===================== */
function guiMayChu(req){
  // Gửi chữ thuần, không đặt header riêng (giống app mẫu) để Apps Script nhận được từ Vercel/GitHub
  return fetch(S.url,{method:'POST',body:JSON.stringify(req)}).then(function(r){ return r.json(); });
}
function goi(action,extra){
  var req=Object.assign({action:action},extra||{});
  var delays=[0,1000,2500,5000], i=0;
  return new Promise(function(res,rej){
    (function lan(){
      setTimeout(function(){
        guiMayChu(req).then(function(r){ res(r); }).catch(function(err){
          i++; if(i<delays.length) lan(); else rej({ok:false,error:'network',message:String(err&&err.message||err)});
        });
      }, delays[i]);
    })();
  });
}
/* ===================== Mở khóa & chọn người (S2) ===================== */
function buocKhoa(id){ ['lockBusy','lockStep0','lockSetup','lockStep2'].forEach(function(k){ $(k).classList.toggle('hidden',k!==id); }); show('vLock'); }
// Hỏi máy chủ: đã đặt tên gọi chưa → màn Cài đặt hoặc "Bạn là ai?"
function moDau(){
  buocKhoa('lockBusy');
  guiMayChu({action:'ping'}).then(function(r){
    if(!r||!r.ok){ loiMayChu(r&&r.message?('Máy chủ báo lỗi: '+r.message):''); return; }
    S.members=r.thanhVien||[]; ls('cn_members',JSON.stringify(S.members));
    if(!r.daCaiDat) moCaiDat(); else chonNguoi();
  }).catch(function(){ loiMayChu(''); });
}
function loiMayChu(msg){
  $('srv').value=S.url||''; buocKhoa('lockStep0');
  $('srvErr').innerHTML=msg?esc(msg):'Không kết nối được máy chủ. Kiểm tra mạng, rồi bấm Kết nối.<br>Nếu vẫn không được: lúc Triển khai phải chọn "Người có quyền truy cập: <b>Bất kỳ ai</b>".';
}
function chonNguoi(){
  buocKhoa('lockStep2');
  $('names').innerHTML=S.members.map(function(m,i){ return '<button class="name-chip" data-i="'+i+'">'+esc(m.ten)+'</button>'; }).join('') || '<div class="hint">Chưa có tên trong tab E1_Thanh_vien.</div>';
  Array.prototype.forEach.call($('names').querySelectorAll('button'),function(b){ b.onclick=function(){ var m=S.members[+b.dataset.i]; S.member=m.ten; ls('cn_member',m.ten); vaoApp(); }; });
}

/* ===================== Kết nối máy chủ (lần đầu) ===================== */
// Nhận đường dẫn đầy đủ …/exec hoặc chỉ mã triển khai (AKfy…)
function chuanDiaChi(s){
  s=String(s||'').trim(); try{ s=decodeURIComponent(s); }catch(e){}
  var m=/https:\/\/script\.google\.com\/[^\s?#"'<>]*?\/s\/([\w-]{20,})\/(?:exec|dev)/.exec(s);
  if(m) return m[0].replace(/\/dev$/,'/exec');
  m=/\b(AKfy[\w-]{20,})\b/.exec(s) || /^([\w-]{30,})$/.exec(s);
  return m ? 'https://script.google.com/macros/s/'+m[1]+'/exec' : '';
}
function maMay(u){ var m=/^https:\/\/script\.google\.com\/macros\/s\/([\w-]+)\/exec$/.exec(u||''); return m?m[1]:encodeURIComponent(u||''); }
function linkApp(){ return location.origin+location.pathname+'?may='+maMay(S.url); }
// Ghi địa chỉ máy chủ vào đường dẫn trang, để "Thêm vào Màn hình chính" vẫn nhớ máy chủ
function ganLink(){ try{ if(new URLSearchParams(location.search).get('may')!==maMay(S.url)) history.replaceState(null,'',location.pathname+'?may='+maMay(S.url)); }catch(e){} }
function ketNoi(){
  var u=chuanDiaChi($('srv').value), err=$('srvErr');
  if(!u){ err.textContent='Đường dẫn chưa đúng. Cần dạng https://script.google.com/macros/s/…/exec'; return; }
  var b=$('btnSrv'); b.disabled=true; b.textContent='Đang kết nối… (lần đầu mất 10–30 giây)'; err.textContent='';
  var cu=S.url; S.url=u;
  guiMayChu({action:'ping'}).then(function(r){
    b.disabled=false; b.textContent='Kết nối';
    if(r&&r.error==='server'){ S.url=cu; err.textContent='Máy chủ báo lỗi: '+(r.message||'')+'. Thử lại sau ít phút.'; return; }
    if(!r||!r.ok||r.app!=='cau-nguyen'){ S.url=cu; err.textContent='Địa chỉ này không phải máy chủ của app (hoặc Code.gs chưa phải bản mới — dán lại Code.gs và Triển khai phiên bản mới).'; return; }
    ls('cn_api',u); ganLink();
    if(cu&&cu!==u) ls('cn_member',null);
    S.members=r.thanhVien||[]; ls('cn_members',JSON.stringify(S.members));
    if(!r.daCaiDat) moCaiDat(); else chonNguoi();
  }).catch(function(){
    S.url=cu; b.disabled=false; b.textContent='Kết nối';
    err.innerHTML='Không kết nối được. Kiểm tra:<br>• đã chép đúng đường dẫn Ứng dụng web<br>• lúc Triển khai đã chọn "Người có quyền truy cập: <b>Bất kỳ ai</b>"';
  });
}
$('btnSrv').onclick=ketNoi;
$('srv').addEventListener('keydown',function(e){ if(e.key==='Enter'&&!e.isComposing) ketNoi(); });

/* ===================== Cài đặt lần đầu: tên gọi ===================== */
function moCaiDat(){ $('suErr').textContent=''; buocKhoa('lockSetup'); }
$('btnSetup').onclick=function(){
  var b=this, err=$('suErr'); b.disabled=true; b.textContent='Đang lưu…'; err.textContent='';
  guiMayChu({action:'cai_dat',tenA:$('suA').value.trim(),tenB:$('suB').value.trim(),tenCon:$('suC').value.trim()}).then(function(r){
    b.disabled=false; b.textContent='Lưu và bắt đầu';
    if(!r||(!r.ok&&r.error!=='da_cai_roi')){ err.textContent='Chưa lưu được: '+(r&&(r.message||r.error)||''); return; }
    S.members=r.thanhVien||[]; ls('cn_members',JSON.stringify(S.members));
    if(r.ok) S.sauCaiDat=true;
    chonNguoi();
  }).catch(function(){ b.disabled=false; b.textContent='Lưu và bắt đầu'; err.textContent='Không kết nối được máy chủ. Kiểm tra mạng rồi thử lại.'; });
};

/* ===================== Chuỗi cả nhà (R18, R19) ===================== */
var THU_NGAN=['CN','T2','T3','T4','T5','T6','T7'];
function thuCua(d){ var p=d.split('-'); return new Date(Date.UTC(+p[0],p[1]-1,+p[2])).getUTCDay(); }
function mapGiu(){ var m={}; ((S.chuoi&&S.chuoi.ngayGiu)||[]).forEach(function(d){ m[d]=1; }); return m; }
// Giống R19 ở máy chủ: đi lùi từ hôm qua, gặp 2 ngày liền không giữ thì dừng; hôm nay đã giữ thì cộng 1
function demChuoi(giu,hn){
  var ds=Object.keys(giu).sort(); if(!ds.length) return 0;
  var d=congNgay(hn,-1), n=0, lo=false;
  while(d>=ds[0]){ if(giu[d]){ n++; lo=false; } else { if(lo) break; lo=true; } d=congNgay(d,-1); }
  return n+(giu[hn]?1:0);
}
function datChuoi(c){ if(!c) return; S.chuoi=c; ls('cn_chuoi',JSON.stringify(c)); if(!$('vHome').classList.contains('hidden')) veHome(); }
function veChuoi(){
  var el=$('streak'); if(!S.chuoi){ el.classList.add('hidden'); return; }
  var giu=mapGiu(), hn=homNayVN(), h='';
  $('skN').textContent=demChuoi(giu,hn);
  for(var k=6;k>=0;k--){ var d=congNgay(hn,-k); h+='<span class="sk-dot'+(giu[d]?' giu':'')+(k===0?' hn':'')+'"><i></i>'+(k===0?'Nay':THU_NGAN[thuCua(d)])+'</span>'; }
  $('skDots').innerHTML=h; el.classList.remove('hidden');
}
function daGiuHomNay(){ return !!mapGiu()[homNayVN()]; }
function xongKinhSang(){
  var ngay=homNayVN(); thaSang(); show('vHome');
  var c=JSON.parse(JSON.stringify(S.chuoi||{ngayGiu:[]})); if(c.ngayGiu.indexOf(ngay)<0) c.ngayGiu.push(ngay);
  datChuoi(c);
  toast('✓ Đã giữ hôm nay · chuỗi '+demChuoi(mapGiu(),ngay)+' ngày');
  ls('cn_cho_xong',ngay); guiXong();
}
function guiXong(){
  var ngay=ls('cn_cho_xong'); if(!ngay) return;
  if(ngay!==homNayVN()){ ls('cn_cho_xong',null); return; } // chỉ đánh dấu được trong chính ngày đó
  goi('xong_ks',{ngay:ngay,nguoiBam:S.member}).then(function(r){ if(r&&r.ok){ ls('cn_cho_xong',null); datChuoi(r.chuoi); } })
    .catch(function(){ toast('Chưa gửi được lên máy chủ — app sẽ tự gửi lại khi có mạng'); });
}
function hoiBoXong(){
  moSheet('<div class="sheet-title">Bỏ đánh dấu Kinh Sáng hôm nay?</div><div class="sheet-sub">Dùng khi lỡ bấm nhầm. Chuỗi sẽ tính lại như chưa đọc.</div>'+
    '<button class="btn btn-red btn-block" id="bxYes">Bỏ đánh dấu</button><button class="btn btn-ghost btn-block" id="bxNo">Giữ nguyên</button>');
  $('bxNo').onclick=dongSheet;
  $('bxYes').onclick=function(){ dongSheet(); ls('cn_cho_xong',null);
    var c=JSON.parse(JSON.stringify(S.chuoi||{ngayGiu:[]})); c.ngayGiu=c.ngayGiu.filter(function(d){ return d!==homNayVN(); }); datChuoi(c);
    goi('bo_xong_ks',{ngay:homNayVN()}).then(function(r){ if(r&&r.ok) datChuoi(r.chuoi); }).catch(function(){ toast('Chưa gửi được — kiểm tra mạng'); }); };
}
// Lịch tháng các ngày đã giữ (S18). Chạm một ngày để mở bài ngày đó (chỉ đọc, không bắt bù).
function moLichGiu(thang){
  var hn=homNayVN(); thang=thang||hn.slice(0,7);
  var y=+thang.slice(0,4), m=+thang.slice(5,7), giu=mapGiu();
  var soNgay=new Date(Date.UTC(y,m,0)).getUTCDate(), dau=(thuCua(thang+'-01')+6)%7; // T2 đầu tuần
  var h='<div class="cal-head"><button class="icon-btn" id="calPrev" aria-label="Tháng trước">‹</button><span class="t">Tháng '+m+'/'+y+'</span><button class="icon-btn" id="calNext" aria-label="Tháng sau">›</button></div><div class="cal">';
  ['T2','T3','T4','T5','T6','T7','CN'].forEach(function(t){ h+='<span class="dw">'+t+'</span>'; });
  for(var i=0;i<dau;i++) h+='<span></span>';
  var dem=0;
  for(var dd=1;dd<=soNgay;dd++){ var d=thang+'-'+p2(dd); if(giu[d]) dem++;
    h+='<button data-d="'+d+'" class="'+(giu[d]?'giu ':'')+(d===hn?'hn':'')+'"'+(d>hn?' disabled':'')+' aria-label="'+tenNgay(d)+(giu[d]?' — đã giữ':'')+'">'+dd+'</button>'; }
  h+='</div><div class="cal-sum">Tháng này đã giữ <b>'+dem+'</b> ngày · chuỗi hiện tại <b>'+demChuoi(giu,hn)+'</b> ngày.</div>'+
    '<div class="hint">Ô xanh: ngày cả nhà đọc xong Kinh Sáng. Lỡ 1 ngày vẫn giữ chuỗi.</div><button class="btn btn-ghost btn-block" id="calNo">Đóng</button>';
  moSheet(h);
  var lui=function(k){ var t=new Date(Date.UTC(y,m-1+k,1)); return t.getUTCFullYear()+'-'+p2(t.getUTCMonth()+1); };
  $('calPrev').onclick=function(){ moLichGiu(lui(-1)); };
  $('calNext').onclick=function(){ moLichGiu(lui(1)); }; $('calNext').disabled=thang>=hn.slice(0,7);
  $('calNo').onclick=dongSheet;
  Array.prototype.forEach.call(document.querySelectorAll('.cal button[data-d]'),function(b){ b.onclick=function(){ dongSheet(); taiNgay(b.dataset.d); }; });
}

/* ===================== Màn Hôm nay (S3) ===================== */
function vaoApp(){
  $('whoLbl').textContent='👤 '+S.member;
  S.homNay=homNayVN(); if(!S.ngay) S.ngay=S.homNay;
  show('vHome'); taiNgay(S.ngay);
  setTimeout(function(){ taiNhieu(congNgay(homNayVN(),5),14).catch(function(){}); },1500); // tải ngầm 2 tuần tới
  try{ var cu=congNgay(homNayVN(),-3), bo=[]; for(var i=0;i<localStorage.length;i++){ var k=localStorage.key(i); if(k&&k.indexOf('cn_cho:')===0&&k.slice(-10)<cu) bo.push(k); } bo.forEach(function(k){ ls(k,null); }); }catch(e){}
  if(S.sauCaiDat){ S.sauCaiDat=false; moQuanTri(); toast('Bước cuối: nạp nội dung cho app'); }
  goi('ping').then(function(r){ if(r&&r.ok){ S.members=r.thanhVien||S.members; ls('cn_members',JSON.stringify(S.members)); datChuoi(r.chuoi); guiXong();
    // Máy chủ có bản mới hoặc nội dung vừa nạp lại: bỏ bài đã lưu trên máy, tải lại
    if(r.phien&&r.phien!==ls('cn_phien')){ var cu=ls('cn_phien'); ls('cn_phien',r.phien); if(cu){ xoaDemMay(); taiNgay(S.ngay); } } } }).catch(function(){});
}
function khoaNgay(){ var keys=[]; try{ for(var i=0;i<localStorage.length;i++){ var k=localStorage.key(i); if(k&&k.indexOf('cn_day:')===0) keys.push(k); } }catch(e){} return keys.sort(); }
function luuDem(ngay,data){
  data._luc=Date.now(); ls('cn_day:'+ngay,JSON.stringify(data));
  var keys=khoaNgay(), giu=40; // giữ 40 ngày trên máy
  while(keys.length>giu){ ls(keys.shift(),null); }
}
function xoaDemMay(){ khoaNgay().forEach(function(k){ ls(k,null); }); }
// Tải nhiều ngày một lần (một lần gọi máy chủ), lưu sẵn trên máy
function taiNhieu(tu,n){
  return goi('days',{tu:tu,soNgay:n}).then(function(r){
    if(r&&r.ok&&r.ngay) Object.keys(r.ngay).forEach(function(k){ if(r.ngay[k]&&r.ngay[k].ok) luuDem(k,r.ngay[k]); });
    return r;
  });
}
// Ngày kề bên chưa có trên máy thì tải ngầm trước, để bấm tiếp là hiện ngay
function taiTruoc(ngay){
  if(S.dangTaiTruoc) return;
  if(![-1,1,2,3].some(function(k){ return !ls('cn_day:'+congNgay(ngay,k)); })) return;
  S.dangTaiTruoc=true;
  taiNhieu(congNgay(ngay,-3),10).then(function(){ S.dangTaiTruoc=false; },function(){ S.dangTaiTruoc=false; });
}
var MOI_PHUT=30*60000; // bản lưu trên máy dưới 30 phút thì không hỏi lại máy chủ
function taiNgay(ngay){
  S.ngay=ngay; $('homeErr').classList.add('hidden');
  var dem=ls('cn_day:'+ngay), coDem=false, moi=false;
  if(dem){ try{ S.data=JSON.parse(dem); coDem=true; moi=Date.now()-(S.data._luc||0)<MOI_PHUT; veHome(); }catch(e){} }
  if(!coDem){ S.data=null; veHome(); }
  taiTruoc(ngay);
  if(moi){ sync('ok'); return; }
  sync('busy');
  // Tải luôn cả mấy ngày quanh ngày này, để bấm ngày trước/sau là hiện ngay
  taiNhieu(congNgay(ngay,-2),7).then(function(r){
    if(S.ngay!==ngay) return;
    var d=r&&r.ok&&r.ngay?r.ngay[ngay]:null;
    if(!d||!d.ok){ sync('off'); baoLoi(r&&r.error==='ngay_khong_hop_le'?'Ngày không hợp lệ.':'Máy chủ báo lỗi: '+esc(r&&r.message||r&&r.error||'')); return; }
    S.data=d; sync('ok'); veHome();
  }).catch(function(e){
    if(S.ngay!==ngay) return;
    sync('off');
    if(!coDem) baoLoi('Chưa tải được bài ngày này — kiểm tra mạng rồi bấm <button class="btn btn-ghost" onclick="taiNgay(S.ngay)">Thử lại</button>');

}

/* ===================== Bộ tách Ca Vịnh 4 Tuần từ PDF (chạy ngay trên máy, không gửi PDF đi đâu) ===================== */
var TachCaVinh=(function(){
// Dùng chung cho trình duyệt và Node: biến nội dung chữ của 1 trang pdf.js thành các dòng
function pageToLines(tc){
  const items=tc.items.filter(it=>it.str!==undefined);
  const rows=[];
  for(const it of items){
    const y=it.transform[5], x=it.transform[4], h=Math.abs(it.transform[3])||it.height||10;
    let r=rows.find(r=>Math.abs(r.y-y)<h*0.45);
    if(!r){ r={y,h,parts:[]}; rows.push(r); }
    r.parts.push({x,s:it.str,w:it.width||0});
  }
  rows.sort((a,b)=>b.y-a.y);
  const out=[];
  let prevY=null;
  const gaps=[];
  for(let i=1;i<rows.length;i++) gaps.push(rows[i-1].y-rows[i].y);
  const sorted=gaps.slice().sort((a,b)=>a-b);
  const lineH=sorted.length? sorted[Math.floor(sorted.length*0.3)] : 12;
  for(const r of rows){
    r.parts.sort((a,b)=>a.x-b.x);
    let s='', lastEnd=null;
    for(const p of r.parts){
      if(lastEnd!==null && p.x-lastEnd>1.5 && !s.endsWith(' ') && !p.s.startsWith(' ')) s+=' ';
      s+=p.s; lastEnd=p.x+p.w;
    }
    const gap = prevY===null?0:(prevY-r.y);
    if(prevY!==null && gap>lineH*1.6) out.push({blank:true});
    out.push({t:s.replace(/\s+/g,' ').trim(), x:r.parts[0].x});
    prevY=r.y;
  }
  return out;
}

// Tách 28 bộ Kinh Sáng (phần "Thánh vịnh 4 tuần") thành các dòng của tab E8_Kinh_Sang
const DOXO='Vinh danh Chúa Cha và Chúa Con, / cùng vinh danh Thánh Thần Thiên Chúa, / tự muôn đời và chính hiện nay, / luôn mãi đến thiên thu vạn đại. Amen.';
const VINH_DANH_XD='Vinh danh Chúa Cha và Chúa Con, cùng vinh danh Thánh Thần Thiên Chúa.';
const TUAN=['I','II','III','IV'], THU=['CN','T2','T3','T4','T5','T6','T7'];
const THU_TEN={CN:'Chúa Nhật',T2:'Thứ Hai',T3:'Thứ Ba',T4:'Thứ Tư',T5:'Thứ Năm',T6:'Thứ Sáu',T7:'Thứ Bảy'};
function nz(s){ return (s||'').replace(/Ð/g,'Đ').replace(/ð/g,'đ').normalize('NFC'); }
function key(s){ return nz(s).toLowerCase().replace(/[*:.()]/g,'').replace(/\s+/g,' ').trim(); }

function flatten(pages){
  const L=[];
  for(const pg of pages){
    let started=false;
    for(const l of pg.lines){
      if(l.blank){ if(started) L.push({blank:true,p:pg.p}); continue; }
      const t=nz(l.t);
      if(/^MỤC LỤC$/i.test(t)) continue;
      started=true;
      L.push({t,x:l.x,p:pg.p});
    }
    L.push({pagebreak:true,p:pg.p});
  }
  return L;
}
const END_HOUR=/^(giờ ba|giờ sáu|giờ chín|kinh trưa|kinh chiều( i| ii)?|kinh sách|kinh tối)$/;
function isDayHeading(t){ return /^(tuần (i|ii|iii|iv)\b|chúa nhật kinh chiều|(chúa nhật|thứ hai|thứ ba|thứ tư|thứ năm|thứ sáu|thứ bảy) kinh sách)/i.test(t); }

function findBlocks(L){
  const starts=[];
  L.forEach((l,i)=>{ if(l.t && key(l.t)==='kinh sáng') starts.push(i); });
  return starts.map((s,n)=>{
    let e=s+1;
    while(e<L.length){
      const l=L[e];
      if(l.t){ const k=key(l.t); if(END_HOUR.test(k)||isDayHeading(l.t)||k==='kinh sáng') break; }
      e++;
    }
    return {start:s,end:e,page:L[s].p};
  });
}

// gom dòng thành đoạn: blank = hết đoạn; ngắt trang KHÔNG cắt đoạn
function paras(lines){
  const out=[]; let cur=[]; let brk=false;
  for(const l of lines){
    if(l.blank){ if(cur.length){ out.push(cur); cur=[]; } continue; }
    if(l.pagebreak){ brk=true; continue; }
    cur.push(brk?Object.assign({},l,{afterBreak:true}):l); brk=false;
  }
  if(cur.length) out.push(cur);
  return out;
}
const verse=ls=>ls.map(l=>l.t.replace(/\s*\*\s*$/,'').replace(/^\*\s*/,'').trim()).filter(Boolean).join(' / ');
const prose=ls=>ls.map(l=>l.t.trim()).join(' ').replace(/\s+/g,' ').replace(/(\S)- (\S)/g,'$1-$2').trim();

function sectionize(lines){
  // trả về {ten: [dòng...]} theo tiêu đề mục
  const S={}; let cur='_dau'; S[cur]=[];
  const pre=[];
  for(const l of lines){
    const mm=l.t && nz(l.t).match(/^\*?\s*Ca\s*v[iị]nh\s*((Tv|Tc)\s.*)$/i);
    const mt=l.t && nz(l.t).match(/^\*?\s*Tc Tin Mừng\s+(\S.*)$/i);
    if(mt){ pre.push({t:'Tc Tin Mừng',x:l.x,p:l.p}); pre.push({t:mt[1],x:l.x,p:l.p}); }
    else if(mm){ pre.push({t:'Ca vịnh',x:l.x,p:l.p}); pre.push({t:mm[1],x:l.x,p:l.p}); } else pre.push(l);
  }
  for(const l of pre){
    if(l.t){
      const k=key(l.t);
      let m=null;
      if(k==='giáo đầu') m='giao_dau';
      else if(k==='thánh thi') m='thanh_thi';
      else if(k==='ca vịnh'||k==='ca vinh') m='ca_vinh';
      else if(/^lời chúa\b/.test(k) && k.length<40){ m='loi_chua'; S.loi_chua_tieu_de=l.t.replace(/^\*/,'').trim(); }
      else if(k==='xướng đáp') m='xuong_dap';
      else if(k==='tc tin mừng'||k==='thánh ca tin mừng'&&false) m='tc_tin_mung';
      else if(/^thánh ca tin mừng/.test(k)) m='benedictus';
      else if(k==='lời cầu') m='loi_cau';
      else if(k==='kinh lạy cha') m='lay_cha';
      else if(/^lời nguyện/.test(k) && k.length<30) m='loi_nguyen';
      if(m){ cur=m; S[cur]=S[cur]||[]; continue; }
    }
    S[cur].push(l);
  }
  return S;
}

function parseBlock(lines, khoa, warn, Sco){
  const S=Sco||sectionize(lines); const rows=[];
  const add=(so,tieu,tuthe,vai,van)=>{ if(!van) return; const n=rows.filter(r=>r.so_phan===so).length+1;
    rows.push({khoa,lop:'tv',so_phan:so,tieu_de_phan:n===1?tieu:'',tu_the:n===1?tuthe:'',thu_tu:n,vai,van_ban:van,trang_thai:'nháp'}); };
  const thieu=(so,tieu,tuthe,ly)=>{ warn.push(`${khoa} phần ${so}: ${ly}`); };
  // 2 Thánh thi
  if(S.thanh_thi&&S.thanh_thi.length){ for(const p of paras(S.thanh_thi)) add('2','THÁNH THI','Đứng','Cả hai',verse(p)); }
  else thieu('2','','','không thấy Thánh thi');
  // 3 Ca vịnh
  if(S.ca_vinh&&S.ca_vinh.length){
    const P=paras(S.ca_vinh); let ps=0, dc=null, turn='A';
    const closePsalm=()=>{ if(ps>0){ add('3','CA VỊNH','Ngồi','Cả hai',DOXO); if(dc) add('3','CA VỊNH','Ngồi','Cả hai',dc); } };
    const isTitle=t=>/^(Tv|Tc)\s/.test(t), isDC=t=>/^ĐC\s*:/.test(t);
    let skipped=false;
    for(const p of P){
      let buf=[], mode=null, dcl=[], title=null;
      const flushStanza=()=>{ if(!buf.length) return; const v=verse(buf); buf=[];
        if(ps===0){ skipped=true; return; }
        if(/^\(.*\)!?$/.test(v.replace(/ \/ /g,' '))) add('3','CA VỊNH','Ngồi','Cả hai',v);
        else { add('3','CA VỊNH','Ngồi',turn,v); turn= turn==='A'?'B':'A'; } };
      const flushDC=()=>{ if(mode==='dc'&&dcl.length){ dc=dcl.map(x=>x.replace(/\s*\*\s*$/,'')).join(' / '); add('3','CA VỊNH','Ngồi','Cả hai',dc);} dcl=[]; if(mode==='dc') mode=null; };
      const flushTitle=()=>{ if(mode==='title'&&title){ add('3','CA VỊNH','Ngồi','Hướng dẫn',title.join(' — ')); } title=null; if(mode==='title') mode=null; };
      for(const l of p){
        const t=l.t;
        if(isTitle(t)){ flushStanza(); flushDC(); flushTitle(); closePsalm(); ps++; dc=null; turn='A'; mode='title'; title=[t]; continue; }
        if(isDC(t)){ flushStanza(); flushTitle(); flushDC(); mode='dc'; dcl=[t.replace(/^ĐC\s*:\s*/,'')]; continue; }
        if(mode==='dc' && !l.afterBreak){ dcl.push(t); continue; }
        if(mode==='dc') flushDC();
        if(mode==='title' && title.length<3 && t.length<70 && !/[,;*]$/.test(t)){ title.push(t); continue; }
        if(mode==='title') flushTitle();
        buf.push(l);
      }
      flushStanza(); flushDC(); flushTitle();
    }
    if(skipped) warn.push(`${khoa} phần 3: có chữ trước tên bài đầu tiên, đã bỏ qua`);
    closePsalm();
    if(ps!==3) warn.push(`${khoa} phần 3: tìm thấy ${ps} bài ca vịnh (mong đợi 3) — cần soát`);
  } else thieu('3','','','không thấy Ca vịnh');
  // 4 Lời Chúa + Xướng đáp
  if(S.loi_chua&&S.loi_chua.length){
    add('4','LỜI CHÚA VÀ XƯỚNG ĐÁP','Ngồi','Hướng dẫn',S.loi_chua_tieu_de);
    add('4','LỜI CHÚA VÀ XƯỚNG ĐÁP','Ngồi','B',prose(S.loi_chua.filter(l=>l.t)));
  } else thieu('4','','','không thấy Lời Chúa');
  if(S.xuong_dap&&S.xuong_dap.length){
    const tx=S.xuong_dap.filter(l=>l.t).map(l=>l.t);
    let R=[],V=[],cur=null;
    for(const t of tx){
      if(/^XĐ\s*:/.test(t)){ cur=R; R.push(t.replace(/^XĐ\s*:\s*/,'')); }
      else if(/^X\s*:/.test(t)){ cur=V; V.push(t.replace(/^X\s*:\s*/,'')); }
      else if(/^Đ\s*:/.test(t)){ cur=null; }
      else if(cur) cur.push(t);
    }
    const r=R.join(' ').replace(/\s+/g,' ').trim(), v=V.join(' ').replace(/\s*\*\s*$/,'').trim();
    const rr=r.replace(/\s*\*\s*/,' '); const tail=(r.split('*')[1]||'').trim();
    if(r){ add('4','','','A',rr); add('4','','','B',rr); if(v) add('4','','','A',v); if(tail) add('4','','','B',tail);
           add('4','','','A',VINH_DANH_XD); add('4','','','B',rr); }
    else warn.push(`${khoa} phần 4: Xướng đáp không đúng dạng XĐ/X — cần soát`);
  } else warn.push(`${khoa} phần 4: không thấy Xướng đáp`);
  // 5a điệp ca Tin Mừng
  if(S.tc_tin_mung&&S.tc_tin_mung.some(l=>l.t)){
    const ls=S.tc_tin_mung.filter(l=>l.t).map(l=>l.t);
    const d=ls.join(' ').replace(/^ĐC\s*:\s*/,'').replace(/\s+/g,' ').trim();
    if(/thay đổi mỗi chúa nhật/i.test(d)) warn.push(`${khoa} phần 5a: sách ghi "điệp ca thay đổi mỗi Chúa nhật" — lấy ở phần riêng từng Chúa Nhật, THIẾU (đợt sau)`);
    else if(/xem|phần riêng/i.test(d) && d.length<80) warn.push(`${khoa} phần 5a: điệp ca nằm ở phần riêng ("${d.slice(0,50)}…") — THIẾU`);
    else add('5a','ĐIỆP CA TIN MỪNG','Đứng','Cả hai',d);
  } else warn.push(`${khoa} phần 5a: không thấy điệp ca Tin Mừng — THIẾU (có thể nằm ở phần riêng)`);
  // 6 Lời cầu
  if(S.loi_cau&&S.loi_cau.some(l=>l.t)){
    const ls=S.loi_cau.filter(l=>l.t);
    const minX=Math.min(...ls.map(l=>l.x));
    const items=[]; let cur=null;
    for(const l of ls){ if(!cur || l.x>minX+6){ cur=[l]; items.push(cur);} else cur.push(l); }
    const txt=items.map(prose);
    const chuan=txt.slice(2).filter(x=>/(^|\s)[-–]\s?\S/.test(x)).length>=2;
    if(txt.length>=3 && !chuan){
      add('6','LỜI CẦU','Đứng','A',txt[0]);
      const rest=ls.slice(items[0].length).map(l=>({t:l.t.trim(),x:l.x}));
      const cnt={}; rest.forEach(l=>cnt[l.t]=(cnt[l.t]||0)+1);
      const refrain=new Set(Object.keys(cnt).filter(k=>cnt[k]>=2));
      const litany=!refrain.size && rest.length%2===0 && rest.every(l=>l.t.length<48);
      if(litany){ let v='A'; for(const l of rest){ add('6','','',v,l.t); v=v==='A'?'B':'A'; }
        warn.push(`${khoa} phần 6: Lời cầu dạng xen kẽ từng câu, đã chia A/B — nên soát`); }
      else {
        let buf=[];
        const flush=()=>{ if(buf.length){ add('6','','','A',buf.join(' ').replace(/\s+/g,' ')); buf=[]; } };
        for(const l of rest){
          if(refrain.has(l.t)){ flush(); add('6','','','B',l.t); continue; }
          if(buf.length && l.x>minX+6) flush();
          buf.push(l.t);
        }
        flush();
        warn.push(`${khoa} phần 6: Lời cầu không theo mẫu thường (${refrain.size?'có câu đáp lặp lại':'không có câu đáp lặp lại'}) — nên soát chia vai`);
      }
    } else if(txt.length>=3){
      add('6','LỜI CẦU','Đứng','A',txt[0]); const dap=txt[1]; add('6','LỜI CẦU','Đứng','B',dap);
      for(const it of txt.slice(2)){ add('6','','','A',it); add('6','','','B',dap); }
    } else {
      // Không thụt lề: dẫn nhập đến dấu ":" hoặc "." đầu tiên, câu đáp là câu ngắn kế tiếp, mỗi ý cầu kết thúc bằng "." và có dấu "-"
      const tx=ls.map(l=>l.t.trim()); tx[0]=tx[0].replace(/^\d+\s*-\s*/,'');
      // Câu đáp: dòng đầu tiên (không phải dòng 1) bắt đầu bằng "Lạy…/Xin…", kết thúc bằng dấu chấm, không có "-"
      const r=tx.findIndex((t,i)=>i>0 && /^(Lạy|Xin|Ôi)\b/.test(t) && /[.!]$/.test(t) && !/(^|\s)[-–]\s?\S/.test(t) && t.length<80);
      const nhom=[]; let cur=[], dau=r>0?tx.slice(0,r).join(' '):null, dap=r>0?tx[r]:null;
      for(const t of (r>0?tx.slice(r+1):[])){ cur.push(t);
        if(/[.!]$/.test(t) && /(^|\s)[-–]\s?\S/.test(cur.join(' '))){ nhom.push(cur.join(' ')); cur=[]; } }
      if(cur.length) nhom.push(cur.join(' '));
      if(dau&&dap&&nhom.length>=2){
        add('6','LỜI CẦU','Đứng','A',dau.replace(/\s+/g,' ')); add('6','LỜI CẦU','Đứng','B',dap);
        nhom.forEach(it=>{ add('6','','','A',it.replace(/\s+/g,' ')); add('6','','','B',dap); });
      } else { warn.push(`${khoa} phần 6: không tách được các ý cầu — đưa nguyên khối`); add('6','LỜI CẦU','Đứng','A',txt.join(' ')); }
    }
  } else warn.push(`${khoa} phần 6: không thấy Lời cầu`);
  // 8b Lời nguyện kết
  if(S.loi_nguyen&&S.loi_nguyen.some(l=>l.t)){
    const ls=[]; for(const l of S.loi_nguyen){ if(l.t && /^(giờ ba|kinh trưa)/i.test(l.t)) break; if(l.t) ls.push(l); }
    let t=prose(ls).replace(/\s*(Thứ (Hai|Ba|Tư|Năm|Sáu|Bảy)|Chúa Nhật)\s*$/,'');
    if(/xem|phần riêng/i.test(t) && t.length<80) warn.push(`${khoa} phần 8b: lời nguyện nằm ở phần riêng — THIẾU`);
    else { add('8b','LỜI NGUYỆN KẾT','Đứng','A',t); add('8b','','','B','Amen.');
      if(/:CN$/.test(khoa)) warn.push(`${khoa} phần 8b: Chúa Nhật Thường Niên có lời nguyện riêng từng Chúa Nhật; bản trong phần 4 tuần chỉ dùng tạm`); }
  } else warn.push(`${khoa} phần 8b: không thấy Lời nguyện — THIẾU (có thể nằm ở phần riêng)`);
  return rows;
}

// Thánh ca Tin Mừng "Chúc tụng Đức Chúa" (Benedictus) — phần 5 cố định, lấy từ một giờ Kinh Sáng ngày thường
function parseBenedictus(lines, warn){
  const S=sectionize(lines); const rows=[];
  const src=(S.benedictus||[]).filter(l=>!(l.t && /^\(?benedictus\)?$/i.test(l.t.trim())));
  const P=paras(src).map(verse).filter(Boolean);
  if(P.length<4){ warn.push('Phần 5 (Thánh ca Tin Mừng): không tách được lời kinh — cần soát'); return rows; }
  const add=(vai,van,tieu,tuthe)=>rows.push({khoa:'co-dinh',lop:'co-dinh',so_phan:'5',tieu_de_phan:tieu||'',tu_the:tuthe||'',thu_tu:rows.length+1,vai,van_ban:van,trang_thai:'nháp'});
  add('Hướng dẫn','{TEN_A} vừa đọc vừa làm dấu Thánh Giá.','THÁNH CA TIN MỪNG','Đứng');
  let v='A'; for(const t of P){ add(v,t); v=v==='A'?'B':'A'; }
  add('Cả hai',DOXO);
  return rows;
}

function parseAll(pages){
  const L=flatten(pages); const blocks=findBlocks(L); const warn=[]; let rows=[];
  if(blocks.length!==28) warn.push(`Tìm thấy ${blocks.length} giờ Kinh Sáng (mong đợi 28). Kiểm tra khoảng trang.`);
  blocks.slice(0,28).forEach((b,n)=>{
    const khoa=`tv:${TUAN[Math.floor(n/7)]}:${THU[n%7]}`;
    b.khoa=khoa;
    rows=rows.concat(parseBlock(L.slice(b.start+1,b.end),khoa,warn));
  });
  let coDinh=[];
  if(blocks[1]) coDinh=parseBenedictus(L.slice(blocks[1].start+1,blocks[1].end),warn);
  return {rows,coDinh,warn,blocks:blocks.map(b=>({khoa:b.khoa,trang:b.page}))};
}

// ===== Phần riêng Mùa Vọng: sách in trọn Kinh Sáng từng ngày (4 tuần × 7 ngày + 17–24/12) =====
const DAU_TRANG=/^(Thứ (Hai|Ba|Tư|Năm|Sáu|Bảy)|Chúa Nhật|Ngày \d{1,2}( tháng 12| -12)?|Tuần [IV]+ Chúa Nhật)\b/;
function flattenMua(pages){
  // Bỏ dòng tiêu đề chạy ở đầu mỗi trang (vd "Thứ Ba (Gr 23,5)") để không lẫn vào bài
  return flatten(pages.map(pg=>{ let bo=false; return {p:pg.p, lines:pg.lines.filter(l=>{
    if(bo||l.blank||!l.t||/^MỤC LỤC$/i.test(nz(l.t).trim())) return true;
    bo=true; const t=nz(l.t).trim(); return !(t.length<60 && DAU_TRANG.test(t) && !/kinh sáng/i.test(t)); })}; }));
}
function chuanDongMua(lines){
  const out=[]; let trongCV=false, dauDoan=true;
  for(const l of lines){
    if(!l.t){ out.push(l); if(l.blank||l.pagebreak) dauDoan=true; continue; }
    let t=nz(l.t).trim(), so=false;
    if(/^Thánh ca Tin Mừng\s*"?Linh hồn/i.test(t)) continue;           // Magnificat của Kinh Chiều lọt sang
    if(/^(Ngày \d{1,2} tháng 12|Thứ (Hai|Ba|Tư|Năm|Sáu|Bảy)|Chúa Nhật)\s*\([^)]*\d[^)]*\)$/.test(t)) continue; // tiêu đề chạy kèm trích dẫn
    if(/^(Thứ (Hai|Ba|Tư|Năm|Sáu|Bảy)|Chúa Nhật)$/.test(t)) continue;      // tiêu đề chạy chỉ có tên thứ
    const cv=t.match(/^\*?\s*Ca\s*v[iị]nh\b(.*)$/i);
    if(cv && !/^\s*(Tv|Tc)\s/.test(cv[1])){                                // "Ca vịnh ĐC", "Ca vịnh ĐCTv 117", "Ca vịnh a vịnh"
      out.push(Object.assign({},l,{t:'Ca vịnh'})); trongCV=true; dauDoan=true;
      const ten=cv[1].match(/(Tv|Tc)\s*\S.*$/); if(ten) out.push(Object.assign({},l,{t:ten[0].replace(/^(Tv|Tc)\s*/,'$1 ')}));
      continue;
    }
    if(/^\*?\s*Ca\s*v[iị]nh\b/i.test(t)) trongCV=true;
    if(/^(Lời Chúa|Xướng đáp)\b/i.test(t)) trongCV=false;
    if(/^lời cầu\b/i.test(t) && t.length<50) t='Lời cầu';
    let m=t.match(/^Đ[cC]\s*\d?\s*:?\s+(\S.*)$/);
    if(!m && trongCV && (dauDoan || /^(Tv|Tc)\s/.test((out.filter(x=>x.t).slice(-1)[0]||{}).t||''))) m=t.match(/^[1-3]\s*[-.]?\s+(\S.*)$/);
    if(m && !/^ĐC\s*:/.test(t)){ t='ĐC: '+m[1]; so=true; }
    t=t.replace(/^XĐ\s+(?!:)/,'XĐ: ').replace(/^X\s+(?=[A-ZÀ-ỸĐ])/,'X: ');
    out.push(Object.assign({},l,{t,daSo:so})); dauDoan=false;
  }
  // Điệp ca in TRƯỚC tên bài (vd Chúa Nhật I): đưa tên bài lên trước để đọc đúng thứ tự
  for(let j=0;j<out.length;j++){
    if(!(out[j].t && /^(Tv|Tc)\s/.test(out[j].t))) continue;
    let k=j-1; while(k>=0 && !out[k].t) k--;            // dòng chữ ngay trước tên bài
    let d=k; while(d>=0 && out[d].t && !out[d].daSo) d--; // lùi về đầu điệp ca
    if(d>=0 && out[d].daSo && k>=d){ const ten=out.splice(j,1)[0]; out.splice(d,0,ten); }
  }
  return out;
}
function suaMuc(S){
  // Lời cầu bị dàn trang đẩy xuống dưới tiêu đề "Lời nguyện": đoạn cuối mới là lời nguyện, các đoạn trước trả về Lời cầu
  if(S.loi_nguyen){
    const P=paras(S.loi_nguyen);
    if(P.length>1 && P.slice(0,-1).some(p=>p.some(l=>/(^|\s)[-–]\s?\S/.test(l.t)))){
      S.loi_cau=(S.loi_cau||[]).concat([{blank:true}]); P.slice(0,-1).forEach(p=>{ S.loi_cau=S.loi_cau.concat(p,[{blank:true}]); });
      S.loi_nguyen=P[P.length-1];
    }
    if(S.loi_nguyen[0]&&S.loi_nguyen[0].t) S.loi_nguyen[0]=Object.assign({},S.loi_nguyen[0],{t:S.loi_nguyen[0].t.replace(/^\d+\.\s*/,'')});
  }
  // Điệp ca Tin Mừng không có tiêu đề, nằm ngay sau Xướng đáp
  if(!(S.tc_tin_mung&&S.tc_tin_mung.some(l=>l.t)) && S.xuong_dap){
    const P=paras(S.xuong_dap); if(P.length>1){ S.xuong_dap=P[0]; S.tc_tin_mung=P.slice(1).reduce((a,p)=>a.concat(p,[{blank:true}]),[]); }
  }
  return S;
}
// Điệp ca Tin Mừng: Chúa Nhật có 3 bản cho năm A, B, C
function diepCaMua(S){
  const ls=(S.tc_tin_mung||[]).filter(l=>!(l.t&&/thay đổi mỗi (ngày|chúa nhật)/i.test(l.t)));
  const tach=[]; let cur=[];
  for(const l of ls){ if(l.blank||(l.t&&/^[ABC]\s+\S/.test(l.t))){ if(cur.length) tach.push(cur); cur=[]; if(l.blank) continue; } if(l.t) cur.push(l); }
  if(cur.length) tach.push(cur);
  const P=tach.map(p=>prose(p).replace(/^ĐC\s*:\s*/,'').replace(/^\d+\s*[-.]\s*/,'').trim()).filter(Boolean);
  if(!P.length) return [];
  const nam=P.map(t=>t.match(/^([ABC])\s+(\S.*)$/));
  if(nam.filter(Boolean).length>=2) return nam.filter(Boolean).map(m=>({nam:m[1],text:m[2]}));
  return [{nam:'',text:P.join(' ')}];
}
function parseMuaVong(pages){
  const L=chuanDongMua(flattenMua(pages)); const blocks=findBlocks(L); const warn=[]; let rows=[];
  if(blocks.length!==36) warn.push(`Mùa Vọng: tìm thấy ${blocks.length} giờ Kinh Sáng (mong đợi 36: 4 tuần × 7 ngày + 17–24/12). Kiểm tra khoảng trang.`);
  const khoaCua=n=> n<28 ? `mua:vong:${Math.floor(n/7)+1}:${THU[n%7]}` : `mua:vong:d${17+n-28}`;
  const theoKhoa={};
  blocks.slice(0,36).forEach((b,n)=>{
    const khoa=khoaCua(n); b.khoa=khoa;
    const S=suaMuc(sectionize(L.slice(b.start+1,b.end)));
    const dc=diepCaMua(S); S.tc_tin_mung=[];
    const w=[]; let r=parseBlock(null,khoa,w,S);
    w.forEach(x=>{ if(!/phần 5a|Thường Niên có lời nguyện riêng/.test(x)) warn.push(x); });
    if(!dc.length) warn.push(`${khoa} phần 5a: không tách được điệp ca Tin Mừng — cần soát`);
    dc.forEach(d=>r.push({khoa:khoa+(d.nam?':'+d.nam:''),lop:'mua',so_phan:'5a',tieu_de_phan:'ĐIỆP CA TIN MỪNG',tu_the:'Đứng',thu_tu:1,vai:'Cả hai',van_ban:d.text,trang_thai:'nháp'}));
    r.forEach(x=>{ if(x.khoa.indexOf('mua:')===0) x.lop='mua'; });
    theoKhoa[khoa]=r; rows=rows.concat(r);
  });
  // Ngày thường tuần I–III, II–IV dùng chung Lời cầu, Lời nguyện: thiếu thì lấy của tuần cặp
  const cap={1:3,3:1,2:4,4:2};
  Object.keys(theoKhoa).forEach(k=>{ const m=k.match(/^mua:vong:(\d):(T\d)$/); if(!m) return;
    ['6','8b'].forEach(so=>{ if(theoKhoa[k].some(r=>r.so_phan===so)) return;
      const nguon=(theoKhoa[`mua:vong:${cap[m[1]]}:${m[2]}`]||[]).filter(r=>r.so_phan===so);
      if(nguon.length){ nguon.forEach(r=>rows.push(Object.assign({},r,{khoa:k}))); warn.push(`${k} phần ${so}: sách ghi dùng chung với tuần ${cap[m[1]]} — đã lấy bản đó`); }
      else warn.push(`${k} phần ${so}: không có — cần soát`); }); });
  return {rows,warn,blocks:blocks.map(b=>({khoa:b.khoa,trang:b.page}))};
}

return {parseAll:parseAll,parseMuaVong:parseMuaVong,pageToLines:pageToLines};
